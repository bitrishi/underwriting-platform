services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      AWS_EC2_METADATA_DISABLED: "true"
      UNDERWRITING_DEMO_MODE: "true"
      SIMULATED_AGENT_DELAY_S: "0.05"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: streamlit run src/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      PYTHONPATH: /app
      UNDERWRITING_API_URL: http://api:8000
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10